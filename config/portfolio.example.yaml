# 4장 사용자 입력 - 보유·관심 종목 예시 파일.
#
# 이 파일을 config/portfolio.yaml로 복사한 뒤 실제 보유 수량/평단/현금으로 바꿔서 쓴다.
#   cp config/portfolio.example.yaml config/portfolio.yaml
# config/portfolio.yaml은 .gitignore에 등록돼 있어 커밋되지 않는다 - 실제 계좌 정보가
# 들어가는 파일이기 때문.
account_currency: KRW

# 계좌가 여러 개면(예: 일반 계좌 + ISA) 현금을 계좌별로 나눠 기록할 수 있다.
# 계좌 간 현금은 서로 옮겨쓸 수 없으므로 비중/현금비율 계산도 계좌별로 분리된다.
cash:
  계좌1: 1000000
  계좌2: 1000000

positions:
  - symbol: "000000" # 실제 종목코드로 변경
    market: KR
    name: 예시종목
    quantity: 1
    avg_price: 10000 # 평단가
    first_buy_date: "2026-01-01"
    purpose: 스윙 # 단기 | 스윙 | 중장기 | 배당 - EMA 세트와 손절 완화 정도가 달라짐
    account: 계좌1 # cash가 계좌별 dict일 때만 의미 있음
    sector: 예시업종
    additional_buys_used: 0
    thesis: [] # 매수 논리 - 나중에 "논리가 아직 유효한가"를 점검하는 데 참고
    # 손절가/목표가를 비워두면(null) 매번 자동 재계산된다 - 손절은 중장기/배당 종목은
    # 전고점 대비 낙폭 기준, 그 외엔 최근 20일 저점. 목표가는 추세반전 참고선(EMA중기선).
    # 직접 정한 값이 있으면 숫자를 넣으면 그 고정값이 우선한다 (app/decision/engine.py 참고).
    stop_loss_price: null
    target_price: null

watchlist:
  - symbol: "EXAMPLE" # 실제 티커로 변경
    market: US
    name: 예시관심종목
    purpose: 스윙
    sector: 예시업종
